<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Suggestion Box</title>
        <link rel="icon" type="image/x-icon" href="./images/Suggestions_boxICO.ico">
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background-color: #f4f8f9;
                color: #333;
            }
            h1{
                text-align: center;
                color: #0056b3;
            }
            .column-container {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 30px;
            }
            .verbiage-editor-column, .parts-list-updater {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 400px;
                height: 400px;
                background-color: #dde3e4;
                border: 1px solid #a5a3a0;
                font-size: 20px;
                color: #0056b3;
                text-align: center;
                
            } 
            .line {
                width: 2px;
                background-color: #a09999;
                margin: 0 20px;
                align-self: stretch;
                height: 400px;
            }
            .submit-button-verbiage, .submit-button-parts {
                margin-top: 20px;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }


        </style>
    </head>
<body>
    <h1>💡Idea Box (Not yet functional)💡</h1>
    <div class="column-container">
        <div class="verbiage-editor-column">
            <h2>Suggestions</h2>
            <form id="suggestions-form">
                <textarea id="suggestion-text" placeholder="Not Functional Yet"></textarea>
                <div class="submit-button-container">
                    <button type="submit" id="submit-button-verbiage" class="submit-button-verbiage">Submit</button>
                </div>
            </form>
        </div>
    <div class="line"></div>
        <div class="parts-list-updater">
            <h2>Bug Report</h2>
            <form id=-bugreport-text">
                <label for="bugreport-text"></label>
                <textarea id="bugreport-text" placeholder="Not Functional Yet"></textarea>
                <div class="submit-button-container">
                    <button type="submit" id="submit-button-parts" class="submit-button-parts">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script>

    </script>
</body>
<footer>
</footer>
</html>
