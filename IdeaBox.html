<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Suggestion Box</title>
        <link rel="icon" type="image/x-icon" href="./images/Suggestions_boxICO.ico">
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background-color: #f4f8f9;
                color: #333;
            }
            h1{
                text-align: center;
                color: #0056b3;
            }
            #web-center-link {
                position: fixed;
                top: 16px;
                left: 16px;
                color: #fff;
                text-decoration: none;
                background-color: #0056b3;
                border: 1px solid #003d80;
                border-radius: 4px;
                padding: 8px 14px;
                font-weight: bold;
                font-size: 0.9em;
                z-index: 1001;
            }
            #web-center-link:hover {
                background-color: #003d80;
            }
            .column-container {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 30px;
            }
            .verbiage-editor-column, .parts-list-updater {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 400px;
                height: 400px;
                background-color: #dde3e4;
                border: 1px solid #a5a3a0;
                font-size: 20px;
                color: #0056b3;
                text-align: center;
                
            } 
            .line {
                width: 2px;
                background-color: #a09999;
                margin: 0 20px;
                align-self: stretch;
                height: 400px;
            }
            textarea {
                width: 320px;
                height: 180px;
                padding: 10px;
                border: 1px solid #a5a3a0;
                border-radius: 6px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 15px;
                box-sizing: border-box;
                resize: vertical;
            }
            .submit-button-verbiage, .submit-button-parts {
                margin-top: 20px;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }


        </style>
    </head>
<body>
    <a href="ebryit_web_center.html" id="web-center-link">🏠 Web Center</a>
    <h1>💡 Idea Box 💡</h1>
    <div class="column-container">
        <div class="verbiage-editor-column">
            <h2>Suggestions</h2>
            <form id="suggestions-form">
                <textarea id="suggestion-text" placeholder="Share an idea or feature request..."></textarea>
                <div class="submit-button-container">
                    <button type="submit" id="submit-button-verbiage" class="submit-button-verbiage">Submit</button>
                </div>
            </form>
        </div>
    <div class="line"></div>
        <div class="parts-list-updater">
            <h2>Bug Report</h2>
            <form id="bugreport-form">
                <label for="bugreport-text"></label>
                <textarea id="bugreport-text" placeholder="Describe a bug you ran into..."></textarea>
                <div class="submit-button-container">
                    <button type="submit" id="submit-button-parts" class="submit-button-parts">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script>
    // Paste the "When an HTTP request is received" trigger URL from the Power Automate
    // flow here (Post message in a chat or channel -> your Teams group chat).
    const POWER_AUTOMATE_URL = 'PASTE_YOUR_FLOW_HTTP_TRIGGER_URL_HERE';

    async function sendEntry(kind, text) {
        const res = await fetch(POWER_AUTOMATE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ kind, text })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
    }

    function flash(button, message, isError) {
        const original = button.textContent;
        button.textContent = message;
        button.style.backgroundColor = isError ? '#b71c1c' : '#28a745';
        setTimeout(() => {
            button.textContent = original;
            button.style.backgroundColor = '#0056b3';
        }, isError ? 3000 : 1800);
    }

    function wireForm(formId, textareaId, buttonId, kind) {
        document.getElementById(formId).addEventListener('submit', async function (e) {
            e.preventDefault();
            const ta = document.getElementById(textareaId);
            const btn = document.getElementById(buttonId);
            const val = ta.value.trim();
            if (!val) return;
            btn.disabled = true;
            try {
                await sendEntry(kind, val);
                ta.value = '';
                flash(btn, '✓ Sent!');
            } catch (err) {
                flash(btn, '✗ Failed — try again', true);
            } finally {
                btn.disabled = false;
            }
        });
    }

    wireForm('suggestions-form', 'suggestion-text', 'submit-button-verbiage', 'Suggestion');
    wireForm('bugreport-form', 'bugreport-text', 'submit-button-parts', 'Bug Report');
    </script>
</body>
<footer>
</footer>
</html>
