<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Settings</title>
        <link rel="icon" type="image/x-icon" href="./images/laptopICO.ico">
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 20px;
                background-color: #f4f7f9;
                color: #333;
            }
            .password-overlay {
                position: fixed;
                inset: 0;
                background: rgba(180, 183, 184, 0.75);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }
            .password-card {
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                width: min(90vw, 360px);
                text-align: center;
            }
            .password-card h2 {
                margin-top: 0;
                color: #0056b3;
            }
            .password-card input {
                width: 100%;
                padding: 10px;
                margin: 12px 0;
                border: 1px solid #c7c7c7;
                border-radius: 4px;
                box-sizing: border-box;
            }
            .password-card button {
                padding: 10px 20px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }
            .password-error {
                color: #b00020;
                min-height: 1.2em;
                margin-top: 10px;
            }
            h1{
                text-align: center;
                color: #0056b3;
            }
            .column-container {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 30px;
            }
            .verbiage-editor-column, .parts-list-updater {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 400px;
                height: 780px;
                background-color: #cccac7;
                border: 1px solid #a5a3a0;
                font-size: 20px;
                color: #0056b3;
                text-align: center;
                
            } 
            .line {
                width: 2px;
                background-color: #a09999;
                margin: 0 20px;
                align-self: stretch;
                height: 780px;
            }
            .submit-button-verbiage, .submit-button-parts {
                margin-top: 20px;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }


        </style>
    </head>
<body>
    <div id="password-overlay" class="password-overlay">
        <div class="password-card">
            <h2>Admins Only!</h2>
            <p>Enter the password to access the page.</p>
            <input type="password" id="password-input">
            <button id="unlock-button" type="button">Unlock</button>
            <p id="password-error" class="password-error" aria-live="polite"></p>
        </div>
    </div>

    <div id="page-content" style="display: none;">
        <h1>Admin Settings</h1>
        <div class="column-container">
            <div class="verbiage-editor-column">
                <h2>Verbiage Editor</h2>
                <label for="device-selection">Select Device:</label>
                <select id="device-selection">
                    <option value="chromebook">Chromebook</option>
                    <option value="chromebook2-1">Chromebook 2-in-1</option>
                    <option value="latitude">Latitude</option>
                    <option value="latitude-pro-2-1">Latitude / Pro 2-in-1</option>
                </select>
                <div class="submit-button-container">
                    <button id="submit-button-verbiage" class="submit-button-verbiage">Submit</button>
                </div>
            </div>
            <div class="line"></div>
            <div class="parts-list-updater">
                <h2>Parts List Updater</h2>
                <div class="nd-icon">📂</div>
                <div class="nd-title">No spreadsheet loaded</div>
                <div class="nd-sub">Drag &amp; drop a Parts Sheet XLSX file here.</div>
                <div class="submit-button-container">
                    <button id="submit-button-parts" class="submit-button-parts">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const correctPassword = "admin";
        const overlay = document.getElementById("password-overlay");
        const pageContent = document.getElementById("page-content");
        const passwordInput = document.getElementById("password-input");
        const errorText = document.getElementById("password-error");

        function unlockPage() {
            if (passwordInput.value.trim() === correctPassword) {
                overlay.style.display = "none";
                pageContent.style.display = "block";
            } else {
                errorText.textContent = "Incorrect password. Please try again.";
                passwordInput.value = "";
                passwordInput.focus();
            }
        }

        document.getElementById("unlock-button").addEventListener("click", unlockPage);
        passwordInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                unlockPage();
            }
        });
    </script>
</body>
<footer>
</footer>
</html>
