    // =========================================================
    // PART NAME EXTRACTION
    // =========================================================
   function extractPartName(issueValue, issueType, categoryKey) {
    if (issueType === 'MISCELLANEOUS') return 'MISCELLANEOUS PART';

    if (issueType === 'ADP') {
        const stripped = issueValue.replace(/^\([^)]+\):\s*/, '');
        if (stripped.startsWith('MOTHERBOARD')) return 'MOTHERBOARD';
        const first = stripped.split(' ')[0];
        if (first === 'LCD') return 'LCD SCREEN';
        if (first === 'BEZEL') return 'BEZEL';
        if (first === 'TOP') return 'TOP COVER';
        if (first === 'PALMREST') return 'PALMREST';
        if (first === 'BOTTOM') return 'BOTTOM COVER';
        if (first === 'KEYBOARD') return 'KEYBOARD';
        if (stripped.startsWith('LEFT HINGE')) return 'LEFT HINGE';
        if (stripped.startsWith('RIGHT HINGE')) return 'RIGHT HINGE';
        if (stripped.startsWith('BOTH HINGES')) return 'LEFT HINGE AND RIGHT HINGE';
        if (stripped.startsWith('DC-IN')) return 'DC-IN PORT';
        return 'PART';
    }

    if (issueType === 'NON-ADP') {
        if (!categoryKey) return 'NON-ADP PART';
        const k = categoryKey.toUpperCase();
        if (k.includes('MOBO') || k.includes('MOTHERBOARD')) return 'MOTHERBOARD';
        if (k.includes('LCD SCREEN')) return 'LCD SCREEN';
        if (k.includes('DABO') || k.includes('DAUGHTERBOARD')) return 'DAUGHTERBOARD';
        if (k.includes('EDP CABLE') || k.includes('LCD CABLE')) return 'LCD CABLE';
        if (k.includes('KEYBOARD')) return 'KEYBOARD';
        if (k.includes('WEBCAM')) return 'WEBCAM';
        if (k.includes('PALMREST')) return 'PALMREST';
        if (k.includes('BATTERY CABLE') || k.includes('BATT CABLE')) return 'BATTERY CABLE';
        if (k.includes('BATTERY')) return 'BATTERY';
        if (k.includes('RAM')) return 'RAM';
        if (k.includes('DC-IN PORT')) return 'DC-IN PORT';
        if (k.includes('TOP COVER')) return 'TOP COVER';
        if (k.includes('AUDIO BOARD')) return 'AUDIO BOARD';
        if (k.includes('SSD') || k.includes('HDD')) return 'SSD';
        if (k.includes('CPU FAN')) return 'CPU FAN';
        if (k.includes('SPEAKERS')) return 'SPEAKERS';
        if (k.includes('WIFI CARD')) return 'WIFI CARD';
        return 'PART';
    }

    return 'PART';
}

    // =========================================================
    // CHECKBOX EVENT HANDLER
    // =========================================================
    function handleIssueChange(event) {
        const cb = event.target;
        const issueValue = cb.value;
        const issueType = cb.getAttribute('data-issue-type');
        const categoryKey = cb.getAttribute('data-category-key') || null;

        const issueObject = {
            value: issueValue,
            type: issueType,
            part: extractPartName(issueValue, issueType, categoryKey)
        };

        if (cb.checked) {
            if (!selectedIssues.some(i => i.value === issueValue)) {
                selectedIssues.push(issueObject);
            }
        } else {
            selectedIssues = selectedIssues.filter(i => i.value !== issueValue);
        }
        updateIssueOrderVisuals();
    }

    function updateIssueOrderVisuals() {
        document.querySelectorAll('.issue-checkbox').forEach(cb => {
            const index = selectedIssues.findIndex(i => i.value === cb.value);
            const span = cb.nextElementSibling;
            if (cb.checked && index !== -1) {
                span.textContent = index + 1;
                span.style.visibility = 'visible';
            } else {
                span.textContent = '';
                span.style.visibility = 'hidden';
            }
        });
    }

    /**
     * Determines the correct part name for the issue.
     */
    function extractPartName(issueValue, issueType, categoryKey = null) {
        if (issueType === 'MISCELLANEOUS') return 'MISCELLANEOUS PART';
        
        // For ADP/Worth Provided issues (Physical Damage)
        if (issueType === 'ADP') {
            // Check for MOBO physical damage section explicitly
            if (issueValue.startsWith('MOTHERBOARD SNAPPED') || 
                issueValue.includes('DAMAGED AUDIO PORT') || 
                issueValue.includes('VISIBLE BURN MARKS') ||
                issueValue.includes('MISSING COMPONENTS') ||
                issueValue.includes('DAMAGED USB-C PORT') ||
                issueValue.includes('DAMAGED USB PORT') ||
                issueValue.includes('VISIBLE SCRATCHES')) {
                return 'MOTHERBOARD';
			}
			
            // Check for EDP physical damage section explicitly
            if (issueValue.startsWith('EDP CABLE DAMAGED') || 
                issueValue.includes('OR FRAYED')) {
                return 'EDP CABLE';
            }

            // Simplified part matching for other ADP issues
            const firstWord = issueValue.split(' ')[0];
            if (firstWord === 'LCD') return 'LCD SCREEN';
            if (firstWord === 'BEZEL') return 'BEZEL';
            if (firstWord === 'TOP') return 'TOP COVER';
            if (firstWord === 'PALMREST') return 'PALMREST';
            if (firstWord === 'BOTTOM') return 'BOTTOM COVER';
            if (firstWord === 'KEYBOARD') return 'KEYBOARD';
            if (issueValue.startsWith('LEFT HINGE')) return 'LEFT HINGE';
            if (issueValue.startsWith('RIGHT HINGE')) return 'RIGHT HINGE';
            // Accept both singular/plural variations produced in issue text
            if (issueValue.startsWith('BOTH HINGES') || issueValue.startsWith('BOTH HINGES')) return 'LEFT HINGE AND RIGHT HINGE';
            if (issueValue.startsWith('DC-IN')) return 'DC-IN PORT';
            return 'PART';
        }

        // For NON-ADP issues (System Failure)
        if (issueType === 'NON-ADP') {
            if (!categoryKey) {
                // Should have been found in handleIssueChange, but search again just in case
                for (const [key, issues] of Object.entries(NON_ADP_ISSUES)) {
                    if (issues.map(i => i.toUpperCase()).includes(issueValue)) {
                        categoryKey = key;
                        break;
                    }
                }
            }
            
            if (!categoryKey) return 'NON-ADP PART';

            // Explicitly map category names to Part Names
            if (categoryKey.includes('MOBO')) return 'MOTHERBOARD';
            if (categoryKey.includes('LCD SCREEN')) return 'LCD SCREEN';
            if (categoryKey.includes('DABO')) return 'DAUGHTERBOARD';
            if (categoryKey.includes('EDP CABLE') || categoryKey.includes('LCD CABLE')) return 'LCD CABLE';
            if (categoryKey.includes('KEYBOARD')) return 'KEYBOARD';
            if (categoryKey.includes('WEBCAM')) return 'WEBCAM';
            if (categoryKey.includes('PALMREST')) return 'PALMREST';
            if (categoryKey.includes('BATTERY')) return 'BATTERY';
			if (categoryKey.includes('BATT CABLE')) return 'BATTERY CABLE';
			if (categoryKey.includes('RAM')) return 'RAM';
			if (categoryKey.includes('DC-IN PORT')) return 'DC-IN PORT';
            if (categoryKey.includes('TOP COVER')) return 'TOP COVER';
            if (categoryKey.includes('AUDIO BOARD')) return 'AUDIO BOARD';
            if (categoryKey.includes('SSD') || categoryKey.includes('HDD')) return 'SSD';
			if (categoryKey.includes('CPU FAN') || categoryKey.includes('CPU FAN')) return 'CPU FAN';
			if (categoryKey.includes('SPEAKERS') || categoryKey.includes('SPEAKERS')) return 'SPEAKERS';
			if (categoryKey.includes('WIFI CARD') || categoryKey.includes('WIFI CARD')) return 'WIFI CARD';

            return 'PART';
        }

        return 'PART';
    }


    // Function to build the dropdown menus and checkboxes
    function createDropdowns(data, containerId, issueType) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        for (const [deviceName, contractTypes] of Object.entries(ISSUE_DATA)) {
            // Level 1: Device header — static, always visible, never collapsible
            const deviceHeader = document.createElement('div');
            deviceHeader.className = 'device-group';

            const deviceLabel = document.createElement('div');
            deviceLabel.className = 'device-group-label';
            deviceLabel.textContent = deviceName;
            deviceHeader.appendChild(deviceLabel);

            const devicePad = document.createElement('div');
            devicePad.style.padding = '8px 0';

            for (const [contractLabel, issueGroups] of Object.entries(contractTypes)) {
                const displayLabel = contractLabel === 'ADP'
                    ? (deviceName === 'Chromebook' ? '▶ ADP Issues (Physical Damage)' : '▶ ADP / Worth Provided Issues (Physical Damage)')
                    : '▶ NON-ADP Issues (System / Component Failure)';

                const issueTypeAttr = contractLabel === 'ADP' ? 'ADP' : 'NON-ADP';
                const contractClass = contractLabel === 'ADP' ? 'adp-group' : 'non-adp-group';

                // Level 2: ADP / NON-ADP — collapsible
                const contractDetails = document.createElement('details');
                contractDetails.className = `contract-group ${contractClass}`;

                const contractSummary = document.createElement('summary');
                contractSummary.textContent = displayLabel;
                contractDetails.appendChild(contractSummary);

                const contractPad = document.createElement('div');
                contractPad.className = 'contract-group-inner-pad';

                for (const [category, issues] of Object.entries(issueGroups)) {
                    // Level 3: Issue category — collapsible
                    const catDetails = document.createElement('details');
                    catDetails.className = 'issue-dropdown';

                    const catSummary = document.createElement('summary');
                    catSummary.textContent = category;
                    catDetails.appendChild(catSummary);

                    const list = document.createElement('div');
                    list.className = 'issue-list';

                    issues.forEach((issue, idx) => {
                        const safeId = `${issueTypeAttr}-${deviceName}-${category}-${idx}`.replace(/[\s\/\(\)&,\.]/g, '-');
                        const item = document.createElement('div');
                        item.className = 'issue-item';

                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.id = safeId;
                        cb.className = 'issue-checkbox';
                        cb.value = issue.toUpperCase();
                        cb.setAttribute('data-issue-type', issueTypeAttr);
                        cb.setAttribute('data-category-key', category);
                        cb.addEventListener('change', handleIssueChange);

                        const orderSpan = document.createElement('span');
                        orderSpan.className = 'issue-order';

                        const label = document.createElement('label');
                        label.htmlFor = safeId;
                        const upperIssue = issue.toUpperCase();
                        label.innerHTML = upperIssue.replace(/(\([^)]+\))/g, '<strong>$1</strong>');

                        item.appendChild(cb);
                        item.appendChild(orderSpan);
                        item.appendChild(label);
                        list.appendChild(item);
                    });

                    catDetails.appendChild(list);
                    contractPad.appendChild(catDetails);
                }

                contractDetails.appendChild(contractPad);
                devicePad.appendChild(contractDetails);
            }

            deviceHeader.appendChild(devicePad);
            container.appendChild(deviceHeader);
        }
    }

    // =========================================================
    // CLEAR ALL
    // =========================================================
    function clearAllIssues() {
        window.scrollTo(0, 0);
        selectedIssues = [];

        document.querySelectorAll('.issue-checkbox').forEach(cb => {
            cb.checked = false;
            cb.nextElementSibling.textContent = '';
            cb.nextElementSibling.style.visibility = 'hidden';
        });

        document.getElementById('unit-description').value = '';
        document.getElementById('cannot-verify-checkbox').checked = false;
        document.getElementById('cannot-verify-description').value = '';
        document.getElementById('cannot-verify-description-container').style.display = 'none';
        document.getElementById('initial-comment-checkbox').checked = false;
        document.getElementById('initial-comment-description').value = '';
        document.getElementById('initial-comment-description-container').style.display = 'none';
        document.getElementById('ber-checkbox').checked = false;
        document.getElementById('doa-checkbox').checked = false;
        document.getElementById('miscellaneous-checkbox').checked = false;
        document.getElementById('miscellaneous-comment-area').value = '';
        document.getElementById('miscellaneous-description-container').style.display = 'none';
        document.getElementById('report-output').textContent = '';
        document.getElementById('on-hold-output').textContent = '';
        document.getElementById('required-photos-output').textContent = '';

        const dontClose = document.getElementById('dont-close-on-clear').checked;
        if (dontClose) {
            document.querySelectorAll('.contract-group, .issue-dropdown').forEach(d => {
                d.open = false;
            });
        }
    }

    // =========================================================
    // REPORT GENERATION (logic unchanged from original)
    // =========================================================
    function cleanIssueDescription(issue) {
        let cleaned = issue.replace(/^\([^)]+\):\s*/, '').trim();
        if (cleaned.endsWith('.')) cleaned = cleaned.substring(0, cleaned.length - 1);
        return cleaned;
    }

    function generateReport() {
        const customDescription = document.getElementById('unit-description').value.trim();
        const hasNoInitialIssue = !customDescription;
        const reportOutput = document.getElementById('report-output');
        const berChecked = document.getElementById('ber-checkbox').checked;
        const doaChecked = document.getElementById('doa-checkbox').checked;

        // =========================================================
        // BER PATH — overrides everything; no issue selections needed
        // =========================================================
        if (berChecked) {
            if (hasNoInitialIssue) alert('Please make sure to add an initial issue description!');
            const berLine1 = `UNIT PRESENTED WITH DESCRIPTION OF: ${customDescription || 'No Issue Given.'}`;
            const berNonAdpIssues = selectedIssues.filter(i => i.type === 'NON-ADP');
            let berNonAdpVerbiage = '';
            if (berNonAdpIssues.length > 0) {
                const cleaned = berNonAdpIssues.map(i => cleanIssueDescription(i.value));
                berNonAdpVerbiage = ' //' + cleaned.join('. // ') + './/';
            }
            const berLine2 = `UPON ARRIVAL: VERIFIED INITIAL ISSUE: LCD SCREEN CRACKED IN MULTIPLE PLACES.${berNonAdpVerbiage}`;
            const berLine3 = `PARTS ORDERED: NONE / AUTOMATIC BER.`;
            const berLine4 = `REPAIRS COMPLETED: NONE.`;
            const berText = [berLine1, berLine2, berLine3, berLine4].join('\n');
            if (hasNoInitialIssue) {
                reportOutput.innerHTML = berText
                    .replace('No Issue Given.', '<span style="color: #dc3545;">No Issue Given.</span>')
                    .replace(/\n/g, '<br>');
            } else {
                reportOutput.textContent = berText;
            }
            document.getElementById('on-hold-output').textContent = '';
            document.getElementById('required-photos-output').textContent = '';
            return;
        }

        // =========================================================
        // DOA PATH — requires at least one NON-ADP issue selected
        // =========================================================
        if (doaChecked) {
            const nonAdpIssues = selectedIssues.filter(i => i.type === 'NON-ADP');
            if (nonAdpIssues.length === 0) {
                alert('Please select at least one NON-ADP issue to use DOA.');
                return;
            }
            const doaBlocks = nonAdpIssues.map(issue => {
                const partName = issue.part;
                const verbiage = cleanIssueDescription(issue.value);
                return `THE ${partName} IS DEAD ON ARRIVAL WHEN INSTALLED. ${verbiage}.`;
            });
            reportOutput.textContent = doaBlocks.join('\n') + '\nPPID:';
            document.getElementById('on-hold-output').textContent = '';
            document.getElementById('required-photos-output').textContent = '';
            return;
        }

        // =========================================================
        // NORMAL PATH
        // =========================================================
        const isRichlandWorth = document.getElementById('richland-worth-checkbox').checked;
        const cannotVerifyChecked = document.getElementById('cannot-verify-checkbox').checked;
        const cannotVerifyDescription = document.getElementById('cannot-verify-description').value.trim();
        const initialCommentChecked = document.getElementById('initial-comment-checkbox').checked;
        const initialCommentDescription = document.getElementById('initial-comment-description').value.trim();

        if (hasNoInitialIssue) alert('Please make sure to add an initial issue description!');

        const nonAdpPartObjects = selectedIssues.filter(i => i.type === 'NON-ADP');
        const uniqueNonAdpParts = [...new Set(nonAdpPartObjects.map(i => i.part.toUpperCase()))];
        const nonAdpCount = nonAdpPartObjects.length;
        const adpIssuesCount = selectedIssues.filter(i => i.type === 'ADP' || i.type === 'MISCELLANEOUS').length;

        let partsListForStatus = '';
        let statusTitle = 'PART';
        if (uniqueNonAdpParts.length > 0) {
            statusTitle = 'PART(S)';
            if (uniqueNonAdpParts.length === 1) { partsListForStatus = uniqueNonAdpParts[0]; statusTitle = 'PART'; }
            else if (uniqueNonAdpParts.length === 2) { partsListForStatus = `${uniqueNonAdpParts[0]} AND ${uniqueNonAdpParts[1]}`; }
            else { const c = [...uniqueNonAdpParts]; const l = c.pop(); partsListForStatus = `${c.join(', ')}, AND ${l}`; }
        }
        const oemWarrantyText = `Waiting Warranty Part from OEM\nAWAITING DELL WARRANTY ${statusTitle}: ${partsListForStatus}.`;

        const line1 = `UNIT PRESENTED WITH DESCRIPTION OF: ${customDescription || 'No Issue Given.'}`;
        let line2Prefix = `UPON ARRIVAL: VERIFIED INITIAL ISSUE: `;
        let reportSections = [];

        if (cannotVerifyChecked && cannotVerifyDescription) {
            line2Prefix = `UPON ARRIVAL: CANNOT VERIFY INITIAL ISSUE: `;
            reportSections.push(cannotVerifyDescription.replace(/\.$/, '') + '. ');
        } else if (initialCommentChecked && initialCommentDescription) {
            reportSections.push(initialCommentDescription.replace(/\.$/, '') + '. ');
        }

        let nonAdpBlock = [];
        selectedIssues.forEach(issue => {
            const isNonAdp = issue.type === 'NON-ADP';
            if (isNonAdp) {
                nonAdpBlock.push(cleanIssueDescription(issue.value));
            } else {
                if (nonAdpBlock.length > 0) {
                    reportSections.push('//' + nonAdpBlock.join('. // ') + './/');
                    nonAdpBlock = [];
                }
               reportSections.push(issue.value.replace(/^\([^)]+\):\s*/, ''));
            }
        });
        if (nonAdpBlock.length > 0) reportSections.push('//' + nonAdpBlock.join('. // ') + './/');

        let finalBody = reportSections.join(' ').trim();
        finalBody = finalBody.replace(/\s+\/\//g, '//').replace(/\/\/\s+/g, '//').replace(/\s*\.\/\//g, '. //').replace(/\. \./g, '.');

        let line2 = line2Prefix + finalBody;

        const parts = [...new Set(selectedIssues.map(i => i.part))];
        const combinedHingeIdx = parts.indexOf('LEFT HINGE AND RIGHT HINGE');
        if (combinedHingeIdx !== -1 && parts.length > 1) parts.splice(combinedHingeIdx, 1, 'LEFT HINGE', 'RIGHT HINGE');

        let partsListText = '';
        if (parts.length === 0) partsListText = 'NONE';
        else if (parts.length === 1) partsListText = parts[0];
        else if (parts.length === 2) partsListText = `${parts[0]} AND ${parts[1]}`;
        else { const last = parts.pop(); partsListText = `${parts.join(', ')}, AND ${last}`; }

        const line3 = `PARTS ORDERED: ${partsListText.toUpperCase()}.`;
        const reportText = [line1, line2, line3].join('\n');

        if (hasNoInitialIssue) {
            reportOutput.innerHTML = reportText.replace('No Issue Given.', '<span style="color: #dc3545;">No Issue Given.</span>').replace(/\n/g, '<br>');
        } else {
            reportOutput.textContent = reportText;
        }

        let holdStatusText = '';
        if (nonAdpCount > 0 && isRichlandWorth && adpIssuesCount === 0) holdStatusText = oemWarrantyText;
        else if (adpIssuesCount > 0 && isRichlandWorth) holdStatusText = `ON HOLD – PENDING\nAWAITING WORTH REPAIRS.`;
        else if (nonAdpCount > 0 && !isRichlandWorth) holdStatusText = oemWarrantyText;
        else if (adpIssuesCount > 0 && !isRichlandWorth) holdStatusText = `ON HOLD – PENDING\nAWAITING ADP REPAIRS.`;
        document.getElementById('on-hold-output').textContent = holdStatusText;

        const allSelectedParts = selectedIssues.map(i => i.part.toUpperCase());
        const hasMotherboard = allSelectedParts.includes('MOTHERBOARD');
        const hasLcd = allSelectedParts.includes('LCD SCREEN');
        const hasLcdCable = allSelectedParts.includes('LCD CABLE');
        const hasNonAdpKeyboard = selectedIssues.some(i => i.part.toUpperCase() === 'KEYBOARD' && i.type === 'NON-ADP');
        const hasNonAdpPalmrest = selectedIssues.some(i => i.part.toUpperCase() === 'PALMREST' && i.type === 'NON-ADP');

        let photoLines = [];
        if (hasMotherboard) photoLines.push('  • Motherboard Part Number');
        if (hasLcd || hasLcdCable) photoLines.push('  • LCD Screen (before & after)');
        if (hasNonAdpKeyboard || hasNonAdpPalmrest) photoLines.push('  • Entire Palmrest');
        if (cannotVerifyChecked) photoLines.push('  • Cannot Verify Initial Issue (proof)');
        document.getElementById('required-photos-output').textContent = 'REQUIRED PHOTOS:\n' + photoLines.join('\n');
    }

    // =========================================================
    // TOGGLE HELPERS
    // =========================================================
    function toggleInitialCommentDescription() {
        const cb = document.getElementById('initial-comment-checkbox');
        const c = document.getElementById('initial-comment-description-container');
        c.style.display = cb.checked ? 'block' : 'none';
        if (!cb.checked) document.getElementById('initial-comment-description').value = '';
    }

    function toggleCannotVerifyDescription() {
        const cb = document.getElementById('cannot-verify-checkbox');
        const c = document.getElementById('cannot-verify-description-container');
        c.style.display = cb.checked ? 'block' : 'none';
        if (!cb.checked) document.getElementById('cannot-verify-description').value = '';
    }

    function copytext() {
        const reportText = document.getElementById('report-output').innerText;
        if (!reportText) return;
        const btn = document.getElementById('copy-button');
        const orig = btn.textContent;
        navigator.clipboard.writeText(reportText).then(() => {
            btn.textContent = '✓ COPIED!';
            btn.style.backgroundColor = '#28a745';
            setTimeout(() => { btn.textContent = orig; btn.style.backgroundColor = ''; }, 2000);
        }).catch(() => {
            alert('Copy failed. Please select and copy the text manually.');
        });
    }

    function copyOnHoldText() {
        let holdText = document.getElementById('on-hold-output').innerText;
        if (!holdText) return;
        holdText = holdText.replace(/^ON HOLD – PENDING\n/, '').replace(/^Waiting Warranty Part from OEM\n/, '');
        const btn = document.getElementById('copy-onhold-button');
        const orig = btn.textContent;
        navigator.clipboard.writeText(holdText).then(() => {
            btn.textContent = '✓ COPIED!';
            btn.style.backgroundColor = '#28a745';
            setTimeout(() => { btn.textContent = orig; btn.style.backgroundColor = ''; }, 2000);
        }).catch(() => {
            alert('Copy failed. Please select and copy the text manually.');
        });
    }

    function toggleMenu() {
        document.getElementById('menu-dropdown').classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
        const menu = document.querySelector('.hamburger-menu');
        const dropdown = document.getElementById('menu-dropdown');
        if (menu && !menu.contains(event.target) && dropdown) dropdown.classList.remove('show');
    });

    // =========================================================
    // INIT
    // =========================================================
    document.addEventListener('DOMContentLoaded', () => {
        buildDropdowns();

        // Miscellaneous — show/hide textarea and keep selectedIssues in sync
        const miscCheckbox  = document.getElementById('miscellaneous-checkbox');
        const miscContainer = document.getElementById('miscellaneous-description-container');
        const miscTextarea  = document.getElementById('miscellaneous-comment-area');

        miscCheckbox.addEventListener('change', function () {
            miscContainer.style.display = this.checked ? 'block' : 'none';
            if (this.checked) {
                miscTextarea.focus();
                if (!selectedIssues.some(i => i.type === 'MISCELLANEOUS')) {
                    selectedIssues.push({ value: 'MISCELLANEOUS PART', type: 'MISCELLANEOUS', part: 'MISCELLANEOUS PART' });
                }
            } else {
                miscTextarea.value = '';
                selectedIssues = selectedIssues.filter(i => i.type !== 'MISCELLANEOUS');
            }
        });

        miscTextarea.addEventListener('input', function () {
            const idx = selectedIssues.findIndex(i => i.type === 'MISCELLANEOUS');
            if (idx !== -1) {
                const val = this.value.trim().toUpperCase();
                selectedIssues[idx].value = val || 'MISCELLANEOUS PART';
                selectedIssues[idx].part  = val || 'MISCELLANEOUS PART';
            }
        });

        document.getElementById('cannot-verify-checkbox').addEventListener('change', toggleCannotVerifyDescription);
        document.getElementById('initial-comment-checkbox').addEventListener('change', toggleInitialCommentDescription);
        toggleCannotVerifyDescription();
        toggleInitialCommentDescription();
        window.clearAllIssues = clearAllIssues;
        window.generateReport = generateReport;
    });
</script>
